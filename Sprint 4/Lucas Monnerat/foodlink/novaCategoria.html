<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova categoria</title>
    <link rel="stylesheet" href="css/novaCategoria.css">
</head>

<body>
    <div class="logo">
        <img src="img/logo.svg" alt="FoodLink" width="100">
    </div>

    <a href="adicionarProduto.html">Voltar ao cadastro de produto</a>

    <h1>Nova categoria</h1>
    <p>Crie uma categoria para organizar os produtos do cardápio.</p>

    <form>
        <label for="nome">Nome da categoria</label><br>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Sobremesas">

        <p>
            <button type="button" onclick="location.href='adicionarProduto.html'">Salvar categoria</button>
        </p>
    </form>

    <p class="rodape">FoodLink</p>
</body>
</html>
