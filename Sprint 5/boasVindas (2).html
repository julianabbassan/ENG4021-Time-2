<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boas-vindas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
    <link href="css/boasVindas.css" rel="stylesheet" type="text/css">
</head>

<body>
    <header class="topo">
        <div class="logo">
            <svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true">
                <path d="M11 0C4.9 0 0 4.9 0 11c0 7.6 8.6 14.8 10.2 16.6.4.5 1.2.5 1.6 0C13.4 25.8 22 18.6 22 11 22 4.9 17.1 0 11 0z" fill="#e8601c"/>
                <g fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 5.5v4a2 2 0 0 0 4 0v-4"/>
                    <path d="M8.5 5.5v11"/>
                    <path d="M14.5 16.5v-11c-1.6 1-2.2 3.2-2.2 5.5h2.2"/>
                </g>
            </svg>
            <span>Food<span class="logo-link">Link</span></span>
        </div>

        <a class="link-restaurante" href="#">
            <svg class="icone" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/><path d="M3 9h18"/></svg>
            Sou restaurante
        </a>
    </header>

    <main class="conteudo">
        <p class="eyebrow">Bem-vindo ao FoodLink</p>
        <h1>Olá, cliente!<br><span>O que vai ser hoje?</span></h1>
        <p class="subtitulo">Encontre seu próximo sabor.<br>Cardápios, preços e opções, tudo em um só lugar.</p>

        <div class="botoes">
            <button class="botao botao-principal" type="button">
                <svg class="icone" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                Buscar estabelecimento
                <svg class="icone" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
            <button class="botao botao-secundario" type="button">
                <svg class="icone" viewBox="0 0 24 24"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
                Escanear QR Code
            </button>
        </div>

        <a class="destaque" href="#">
            <img src="img/prato.jpg" alt="">
            <div class="destaque-texto">
                <div>
                    <p class="destaque-legenda">Um clássico que abraça.</p>
                    <p class="destaque-titulo">Casa di Pasta</p>
                </div>
                <svg class="icone" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </div>
        </a>
    </main>

    <div class="divisor"></div>

    <nav class="menu-inferior">
        <a href="#">Explorar</a>
        <a href="#">Favoritos <span class="badge">1</span></a>
        <a href="#">
            <svg class="icone" viewBox="0 0 24 24"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
            Ler QR Code
        </a>
    </nav>
</body>
</html>
