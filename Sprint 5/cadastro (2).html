<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@800&display=swap" rel="stylesheet">
    <link href="css/cadastro.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div class="tela">
        <header class="topo">
            <button class="botao-voltar" type="button" onclick="history.back()" aria-label="Voltar">
                <svg class="icone" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            </button>
            <img class="logo" src="img/logo.jpg" alt="FoodLink">
        </header>

        <p class="eyebrow">Crie sua conta</p>
        <h1>Preencha com<br>seus dados</h1>

        <form>
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Como podemos te chamar?">
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label for="senha">Escolha uma senha</label>
                <input type="password" id="senha" placeholder="Mínimo 8 caracteres">
            </div>

            <label class="termos">
                <input type="checkbox">
                <span>Declaro estar ciente de que estou fornecendo meus dados para uso do aplicativo.</span>
            </label>

            <button class="botao-seta" type="submit" aria-label="Continuar">
                <svg class="icone" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </form>
    </div>
</body>
</html>
