<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Renomear categoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link href="css/renomearCategoria.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div class="tela">
        <button class="botao-fechar" type="button" onclick="history.back()" aria-label="Fechar">
            <svg class="icone" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>

        <p class="eyebrow">Organização</p>
        <h1>Renomear categoria</h1>

        <form>
            <div class="campo">
                <label for="nome">Nome da categoria</label>
                <input type="text" id="nome" value="Bebidas">
            </div>

            <button class="botao-salvar" type="submit">Salvar categoria</button>
        </form>
    </div>
</body>
</html>
